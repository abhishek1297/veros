setup_file: veros/setups/global_flexible/global_flexible.py

launcher: mpirun
rank_env: OMPI_COMM_WORLD_RANK
local_rank_env: OMPI_COMM_WORLD_LOCAL_RANK
memory_sample_interval: 5
communication_profile: true
jax_trace: true
profiler: none
profiler_args: ""
timesteps: 3
repetitions: 1

environment:
  init: |
    source $HOME/anaconda3/etc/profile.d/conda.sh
    conda activate veros

strong:
  size: [180, 80, 20]

weak:
  local_size: [180, 80, 20]

# single local GPU: only a 1-node/1-GPU case makes sense here
topologies:
  - nodes: 1
    gpus_per_node: 1
