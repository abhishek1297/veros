setup_file: veros/setups/global_flexible/global_flexible.py

launcher: mpirun
rank_env: OMPI_COMM_WORLD_RANK
profiler: nsys
profiler_args: "--trace=cuda,nvtx --sample=none"
timesteps: 5
repetitions: 1

environment:
  omp_num_threads: 1
  veros_asset_dir: /Odyssey/private/e25cheve/veros/veros_assets
  home: /Odyssey/private/e25cheve/
  conda_sh: /Odyssey/private/e25cheve/miniconda3/etc/profile.d/conda.sh
  conda_env: /Odyssey/private/e25cheve/miniconda3/envs/veros

strong:
  size: [180, 80, 20]

weak:
  local_size: [90, 40, 20]

# Every nodes x gpus_per_node pair is run for both scaling modes.
topologies:
  - nodes: 1
    gpus_per_node: 1
  - nodes: 1
    gpus_per_node: 2
  - nodes: 1
    gpus_per_node: 4
  - nodes: 2
    gpus_per_node: 4
  - nodes: 3
    gpus_per_node: 4
  - nodes: 4
    gpus_per_node: 4
