setup_file: veros/setups/global_flexible/global_flexible.py

launcher: mpirun
rank_env: OMPI_COMM_WORLD_RANK
local_rank_env: OMPI_COMM_WORLD_LOCAL_RANK
memory_sample_interval: 5
profiler: nsys
profiler_args: "--trace=cuda,nvtx --sample=none --cuda-memory-usage=true --cuda-graph-trace=node"
timesteps: 5
repetitions: 1

environment:
  init: |
    export OMP_NUM_THREADS=1
    export MPI4JAX_USE_CUDA_MPI=1
    export VEROS_ASSET_DIR=/Odyssey/private/e25cheve/veros/veros_assets
    export HOME=/Odyssey/private/e25cheve/

    source /Odyssey/private/e25cheve/miniconda3/etc/profile.d/conda.sh
    conda activate /Odyssey/private/e25cheve/miniconda3/envs/veros

strong:
  size: [180, 80, 20]

weak:
  local_size: [90, 40, 20]

# Every nodes x gpus_per_node pair is run for both scaling modes.
topologies:
  - nodes: 1
    gpus_per_node: 1
  - nodes: 1
    gpus_per_node: 2
  - nodes: 1
    gpus_per_node: 4
  - nodes: 2
    gpus_per_node: 4
  - nodes: 3
    gpus_per_node: 4
  - nodes: 4
    gpus_per_node: 4
